<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODOZE · OPTC 剪枝</title><link rel="stylesheet" href="/assets/styles.css?v=optc2"></head>
<body><main>
<header><div><span class="eyebrow">NODOZE / OPTC</span><h1>日志剪枝</h1><p id="dataset">正在读取数据…</p></div><span id="health" role="status">连接中</span></header>
<div id="error" role="alert" hidden></div>
<section id="poi-panel"><div class="heading"><h2>手动设置 POI</h2><span class="muted">已按 Ground Truth 配置</span></div><form id="poi-form"><div class="tools"><select id="poi-select" aria-label="Ground Truth POI"></select><input id="poi-id" aria-label="POI 事件 ID" placeholder="输入事件 ID 或选择上方预设" required><button id="apply-poi" type="submit">应用 POI 并重新剪枝</button></div></form><p id="poi-evidence" class="muted"></p><p id="history-note" class="muted"></p><p id="prune-status" role="status"></p></section>
<section aria-label="剪枝统计" id="metrics" class="metrics"></section>
<section><div class="heading"><h2>剪枝前后</h2><label><input type="checkbox" id="show-scores"> 显示边分数</label></div><p id="scope-note" class="muted"></p><div class="comparison"><article><h3>剪枝前 <span id="before-count"></span></h3><svg id="before" viewBox="0 0 640 420" aria-label="剪枝前图"></svg></article><article><h3>剪枝后 <span id="after-count"></span></h3><svg id="after" viewBox="0 0 640 420" aria-label="剪枝后图"></svg></article></div><p class="legend"><span class="keep">● 保留</span><span class="remove">┄ 删除</span><span class="truth">● PDF 参考</span><span>两图坐标相同 · 点击边查看原始日志</span></p></section>
<section><div class="heading"><h2>每条边的评分</h2><span id="edge-total" class="muted"></span></div><p class="muted">评分用于重要性排序，不是恶意概率。评分曲线与下表对应；每条候选边均可查询。频次为 0 表示 POI 前未观察到同语义交互。</p><div class="tools"><input id="edge-search" type="search" placeholder="搜索进程、文件、IP、事件 ID" aria-label="搜索边"><select id="edge-decision" aria-label="筛选剪枝结果"><option value="all">全部边</option><option value="retained">保留</option><option value="removed">删除</option><option value="reference">PDF 参考匹配</option></select><button id="clear-edge">重置筛选</button></div><svg id="score-chart" viewBox="0 0 1000 150" aria-label="当前页逐边评分曲线"></svg><div class="table-scroll"><table><thead><tr><th>时间 / 操作</th><th>源 → 目标</th><th>评分 / 评分线</th><th>POI 前频次</th><th>结果</th></tr></thead><tbody id="edge-rows"></tbody></table></div><div class="pagination"><span id="page-info"></span><div><button id="prev-page">上一页</button><button id="next-page">下一页</button></div></div><details id="event-detail"><summary>选中事件的原始日志与评分依据</summary><button id="use-event-poi" type="button" disabled>将选中事件设为 POI</button><pre id="details">点击图中的边、评分点或表格行查看。</pre></details></section>
<section><div class="heading"><h2>运行日志</h2><span class="muted">本次已完成运行</span></div><pre id="run-log" role="log">加载中…</pre><details><summary>数据范围与 Ground Truth</summary><p id="truth-note"></p><div id="stage-results"></div><p id="source-note"></p></details></section>
</main><script src="/assets/app.js?v=optc2"></script></body></html>
